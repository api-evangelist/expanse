name: Expanse
description: 'Expanse (originally founded as Qadium) was a cybersecurity company specializing
  in internet attack surface management, continuously discovering and monitoring an
  organization''s internet-connected assets to find exposures and unmanaged risk. The
  company was backed by IVP, Susa Ventures, and Y Combinator, and was acquired by Palo
  Alto Networks in 2020. Its technology now ships as Cortex Xpanse, part of the Palo
  Alto Networks Cortex platform, and the expanse.co domain 301-redirects to the Cortex
  Xpanse product page. This profile is retained as an acquired-company lead in the API
  Evangelist network; the company no longer operates an independent developer program
  or public API surface.'
